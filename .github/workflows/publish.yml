name: Publish

on:
  push:
    tags: ["v*"]
  # Resume a publish that died after the npm step (a transient Sigstore or
  # GitHub failure leaves the version on npm with no signed binaries, no
  # release and no tap update, and a re-run of the tag's job would fail at
  # `npm publish` before reaching them). Every step below is idempotent on
  # what already exists, so dispatching the tag finishes what the push started.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish or resume (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Pack once and publish that exact file, so the Homebrew step can checksum
      # the bytes npm received without fetching them back through npm's CDN.
      # A local pack does not reproduce an earlier run's bytes, so the file is
      # only trusted when THIS run published it.
      - name: Publish to npm (with provenance)
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ "$(npm view "@agent-score/pay@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@agent-score/pay@${VERSION} is already on npm; skipping publish (resumed run)"
            exit 0
          fi
          TARBALL="$RUNNER_TEMP/$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -1)"
          test -s "$TARBALL"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
            echo "prerelease detected — publishing under dist-tag: $DIST_TAG"
            npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
          else
            npm publish "$TARBALL" --access public --provenance
          fi
          echo "PUBLISHED_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Build native binaries
        run: bun run build:binary:all

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign native binaries with cosign (keyless, OIDC)
        run: |
          for f in dist/bin/agentscore-pay-*; do
            cosign sign-blob --yes \
              --bundle "$f.bundle" \
              "$f"
          done

      - name: Create GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists; uploading any missing assets"
            gh release upload "$RELEASE_TAG" --clobber dist/bin/agentscore-pay-*
            exit 0
          fi
          gh release create "$RELEASE_TAG" --generate-notes \
            dist/bin/agentscore-pay-darwin-arm64 \
            dist/bin/agentscore-pay-darwin-arm64.bundle \
            dist/bin/agentscore-pay-darwin-x64 \
            dist/bin/agentscore-pay-darwin-x64.bundle \
            dist/bin/agentscore-pay-linux-arm64 \
            dist/bin/agentscore-pay-linux-arm64.bundle \
            dist/bin/agentscore-pay-linux-x64 \
            dist/bin/agentscore-pay-linux-x64.bundle \
            dist/bin/agentscore-pay-windows-x64.exe \
            dist/bin/agentscore-pay-windows-x64.exe.bundle
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        if: env.GH_TOKEN != ''
        run: |
          set -euo pipefail
          VERSION_NO_V="${VERSION#v}"
          TARBALL_URL="https://registry.npmjs.org/@agent-score/pay/-/pay-${VERSION_NO_V}.tgz"
          # The registry's recorded integrity is the authority on which bytes the
          # formula must pin. Package metadata appears within seconds of a
          # publish; the tarball URL can serve a cached 404 for far longer, which
          # is why this step never waits on it when it has the file already.
          INTEGRITY=""
          for i in $(seq 1 30); do
            INTEGRITY="$(npm view "@agent-score/pay@${VERSION_NO_V}" dist.integrity 2>/dev/null || true)"
            [ -n "$INTEGRITY" ] && break
            sleep 10
          done
          [ -n "$INTEGRITY" ] || { echo "registry has no integrity for ${VERSION_NO_V} after 5 minutes" >&2; exit 1; }
          integrity_of() { echo "sha512-$(openssl dgst -sha512 -binary "$1" | base64 -w0)"; }

          if [ -n "${PUBLISHED_TARBALL:-}" ] && [ "$(integrity_of "$PUBLISHED_TARBALL")" = "$INTEGRITY" ]; then
            TARBALL_FILE="$PUBLISHED_TARBALL"
            echo "using the tarball this run published"
          else
            # Resumed run: the version was published earlier, so fetch it.
            TARBALL_FILE=/tmp/pay.tgz
            for i in $(seq 1 40); do
              if curl -fsSL "$TARBALL_URL" -o "$TARBALL_FILE" && [ "$(integrity_of "$TARBALL_FILE")" = "$INTEGRITY" ]; then
                echo "downloaded tarball matches the registry integrity"
                break
              fi
              if [ "$i" = "40" ]; then
                echo "could not fetch a tarball matching ${INTEGRITY} in 10 minutes" >&2
                exit 1
              fi
              sleep 15
            done
          fi
          SHA256=$(shasum -a 256 "$TARBALL_FILE" | awk '{print $1}')
          echo "tarball: $TARBALL_URL"
          echo "sha256:  $SHA256"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/agentscore/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          # template has literal ${URL} / ${SHA} tokens; sed substitutes them.
          # Escape the literal $ in the search pattern via single-quoted shell + \$.
          sed -e 's|\${URL}|'"$TARBALL_URL"'|g' \
              -e 's|\${SHA}|'"$SHA256"'|g' \
              ../Formula/agentscore-pay.rb.template > Formula/agentscore-pay.rb
          git config user.name 'agentscore-bot'
          git config user.email 'bot@agentscore.com'
          git add Formula/agentscore-pay.rb
          git commit -m "agentscore-pay $VERSION" || echo "no changes"
          git push origin HEAD
