# OSV-Scanner allowlist. Each entry must document why the advisory is not
# exploitable in this codebase. Keep this list minimal and revisit on review.

# zod 3.25.76: GHSA-mrhx-c7xc-m3w5 covers every release below 4.6.6 and no 3.x
# fix exists. The hoisted zod is on a fixed 4.x; this entry is scoped to the 3.x
# copies nested under @x402/core and @x402/evm, whose latest releases still
# require zod ^3, so a 4.x regression still fails the scan. The flaw is memory
# growth when an array schema with no length limit rejects a very large array.
# No merchant-controlled input reaches these copies: the client decodes a 402's
# PAYMENT-REQUIRED header and a v1 body with JSON.parse and no schema, and the
# zod 3 parses on the client path validate facilitator responses only. Lift when
# the x402 packages accept zod 4.
[[PackageOverrides]]
name = "zod"
version = "3.25.76"
ecosystem = "npm"
effectiveUntil = 2027-01-24
vulnerability.ignore = true
reason = "GHSA-mrhx-c7xc-m3w5 has no zod 3.x fix and the x402 packages still require zod ^3. No merchant-controlled input reaches these copies: the 402 is decoded with JSON.parse, and the zod 3 parses validate facilitator responses only."
