[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = "brace-expansion DoS via unbounded expansion. Both locked copies (1.1.16, 5.0.7) arrive only through dev/build tooling: eslint 9's minimatch@3 chain and typescript-eslint's nested minimatch@10. A `bun install --production` tree contains no brace-expansion at all, so no request path reaches it. The 1.x line has no fixed release, and the fix (5.0.8) is not API-compatible with it (1.x exports a callable, 5.x exports an object), so forcing 5.0.8 breaks @eslint/config-array at lint time; verified by pinning it and watching eslint exit 2. Revisit when the eslint and typescript-eslint chains move to minimatch >= 10."
